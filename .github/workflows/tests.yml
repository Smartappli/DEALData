name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (${{ matrix.layer }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dealdata_test
          POSTGRES_USER: dealdata
          POSTGRES_PASSWORD: dealdata_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealdata -d dealdata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: core_layer
            settings: core.settings
            coverage_package: core_data
          - layer: gps_layer
            settings: gps.settings
            coverage_package: gps_data
          - layer: sensor_layer
            settings: sensor.settings
            coverage_package: sensor_data
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r "${{ matrix.layer }}/requirements.txt" \
            pytest \
            pytest-cov \
            pytest-django

      - name: Compile Python files
        run: python -m compileall -q ${{ matrix.layer }}

      - name: Django check
        working-directory: ${{ matrix.layer }}
        env:
          DATABASE_USE_POSTGRES: "true"
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: dealdata_test
          DATABASE_USER: dealdata
          DATABASE_PASSWORD: dealdata_test_password
        run: python manage.py check

      - name: Check migrations are committed
        working-directory: ${{ matrix.layer }}
        env:
          DATABASE_USE_POSTGRES: "true"
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: dealdata_test
          DATABASE_USER: dealdata
          DATABASE_PASSWORD: dealdata_test_password
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: ${{ matrix.layer }}
        env:
          DATABASE_USE_POSTGRES: "true"
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: dealdata_test
          DATABASE_USER: dealdata
          DATABASE_PASSWORD: dealdata_test_password
        run: |
          python -m pytest . \
            --ds=${{ matrix.settings }} \
            --cov=${{ matrix.coverage_package }} \
            --cov-report=term-missing \
            --cov-report=xml:../coverage-${{ matrix.layer }}.xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.layer }}
          path: coverage-${{ matrix.layer }}.xml
          if-no-files-found: error

  docker-build:
    name: Docker build (${{ matrix.layer }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        layer: [core_layer, gps_layer, sensor_layer]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build image
        run: docker build --pull ./${{ matrix.layer }}
