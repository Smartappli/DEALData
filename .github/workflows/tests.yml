name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (${{ matrix.layer }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: core_layer
            settings: core.settings
          - layer: gps_layer
            settings: gps.settings
          - layer: sensor_layer
            settings: sensor.settings
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r "${{ matrix.layer }}/requirements.txt" \
            pytest \
            pytest-django

      - name: Django check
        working-directory: ${{ matrix.layer }}
        run: python manage.py check

      - name: Check migrations are committed
        working-directory: ${{ matrix.layer }}
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: ${{ matrix.layer }}
        run: python -m pytest . --ds=${{ matrix.settings }} -q
